const OKT={'application/pdf':1,'image/jpeg':1,'image/png':1},MAXF=15*1024*1024;
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('tms_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const fput=async(id,b)=>{const d=await idb();return new Promise((res,rej)=>{const x=d.transaction('f','readwrite');x.objectStore('f').put(b,id);x.oncomplete=res;x.onerror=()=>rej(x.error)})};
const fget=async id=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const fdel=async id=>{try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const ftype=f=>{if(OKT[f.type])return f.type;const n=f.name.toLowerCase();return/\.pdf$/.test(n)?'application/pdf':/\.(jpe?g)$/.test(n)?'image/jpeg':/\.png$/.test(n)?'image/png':''};
const pinf=p=>{const t=p.tid&&db.ts.find(x=>x.id==p.tid);return t?{i:t.i,o:own(t),c:t.c,sj:t.sj,d:t.d,y:t.y,t:t.t}:p};

async function addPapers(files,meta){let ok=0;for(const f of files){const ty=ftype(f);if(!ty){toast('⚠ '+f.name+': only JPG, PNG or PDF');continue}if(f.size>MAXF){toast('⚠ '+f.name+' is over 15 MB');continue}
try{const id=uid();await fput(id,f.slice(0,f.size,ty));db.pp.push(Object.assign({id,name:f.name,type:ty,size:f.size,up:today(),tid:null},meta));ok++}catch(e){toast('⚠ Could not save file on this device');break}}
